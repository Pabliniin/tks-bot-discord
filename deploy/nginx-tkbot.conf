# Configuración de Nginx para TK$ Bot.
#
# Instalación en el VPS:
#   sudo cp deploy/nginx-tkbot.conf /etc/nginx/sites-available/tkbot
#   sudo ln -s /etc/nginx/sites-available/tkbot /etc/nginx/sites-enabled/tkbot
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sustituye tudominio.com por tu dominio real ANTES de copiarlo.
# El HTTPS lo añade Certbot automáticamente después (ver DEPLOY.md).

server {
    listen 80;
    listen [::]:80;

    server_name tudominio.com www.tudominio.com;

    # Certbot escribe aquí el archivo de verificación del certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Tamaño máximo de subida (fondos de las tarjetas, adjuntos…).
    client_max_body_size 10M;

    # No revelar la versión de Nginx.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Cabeceras necesarias para que Next.js sepa el dominio y el protocolo
        # reales. Sin X-Forwarded-Proto, las cookies seguras no funcionan.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Soporte de websockets (lo usa la recarga de Next y futuras mejoras).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Los archivos estáticos de Next llevan hash en el nombre: se cachean
    # indefinidamente sin riesgo de servir una versión antigua.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Compresión de las respuestas de texto.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;
}

# IMPORTANTE: la API interna del bot (puerto 3001) NO se expone aquí a
# propósito. Solo escucha en 127.0.0.1 y la consume la web desde el mismo
# servidor. No añadas un bloque para ella.
